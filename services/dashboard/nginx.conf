# Serves the FORESENTRY site and console. Paths such as /console and /learn/<slug>
# are handled in the browser, so unknown paths fall back to index.html.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /assets/ {
        # File names carry a content hash, so they can be cached for a long time.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
