[project]
name = "fraud-detection-platform"
version = "0.1.0"
description = "Real-time payment fraud detection on synthetic data"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "redis>=5.0",
    "confluent-kafka>=2.4",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "prometheus-client>=0.20",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fakeredis>=2.23", "httpx>=0.27", "ruff>=0.5"]
ml = ["mlflow>=2.14", "xgboost>=2.0", "optuna>=3.6", "shap>=0.45"]

[tool.pytest.ini_options]
pythonpath = ["libs", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042", "E731"]
