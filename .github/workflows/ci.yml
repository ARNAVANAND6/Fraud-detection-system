name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check libs services ml tests tools
      - run: python services/generator/generator.py --mode csv --n 50000 --rate 50
      - run: python ml/train.py --version ci && mkdir -p models/current && cp models/ci/* models/current/
      - run: pytest -q
  dashboard:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run build
